# Cut a release whenever a new tag is pushed to the repo.
name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. v0.0.0-alpha'
        required: true
        type: string

jobs:
  variables:
    outputs:
      version: ${{ steps.var.outputs.version }}
      tag: ${{ steps.var.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Setting global variables
        uses: actions/github-script@v7
        id: var
        with:
          script: |
            let tag = '';
            if (context.eventName === 'workflow_dispatch') {
              tag = context.payload.inputs.version;
            } else {
              tag = context.ref.replace('refs/tags/', '');
            }
            const version = tag.startsWith('v') ? tag.substring(1) : tag;
            core.setOutput('version', version);
            core.setOutput('tag', tag);

  build-win-release:
    uses: ./.github/workflows/build-win.yml
    needs: variables
    with:
      artifact-retention-days: 1
      version: ${{ needs.variables.outputs.version }}

  build-mac-arm64-release:
    uses: ./.github/workflows/build-mac.yml
    needs: variables
    with:
      artifact-retention-days: 1
      version: ${{ needs.variables.outputs.version }}
      run-on: macos-latest

  build-mac-x86-release:
    uses: ./.github/workflows/build-mac.yml
    needs: variables
    with:
      artifact-retention-days: 1
      version: ${{ needs.variables.outputs.version }}
      run-on: macos-15-intel

  build-linux-release:
    uses: ./.github/workflows/build-linux.yml
    needs: variables
    with:
      artifact-retention-days: 1
      version: ${{ needs.variables.outputs.version }}

  create-release:
    name: Create Release
    needs: [variables, build-win-release, build-mac-arm64-release, build-mac-x86-release, build-linux-release]
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows binary
        id: download-windows
        uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: ./artifacts/

      - name: Download Mac arm64 binary
        id: download-mac-arm64
        uses: actions/download-artifact@v4
        with:
          name: mac-binary-arm64
          path: ./artifacts/

      - name: Download Mac x86 binary
        id: download-mac-x86_64
        uses: actions/download-artifact@v4
        with:
          name: mac-binary-x86_64
          path: ./artifacts/

      - name: Download Linux binary
        id: download-linux
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: ./artifacts/

      - name: Generate changelog
        id: changelog
        run: |
          # Generate "filter" script to extract changes from CHANGELOG.md
          cat >filter.py <<EOF
          import sys
          file = sys.argv[1]
          version = sys.argv[2]
          printing = False
          with open(file, 'r') as f:
              for line in f:
                  if line.startswith(f"## v{version}"):
                      printing = True
                      continue
                  if line.startswith("## "):
                      printing = False
                  if printing:
                      print(line, end="")
          EOF

          # Extract changes from CHANGELOG.md
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "# Release ${{ needs.variables.outputs.tag }}" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "## Changes" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          python3 filter.py CHANGELOG.md ${{ needs.variables.outputs.version }} >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.variables.outputs.tag }}
          name: Release ${{ needs.variables.outputs.tag }}
          body: ${{ env.CHANGELOG }}
          draft: false
          prerelease: ${{ contains(needs.variables.outputs.tag, '-alpha') || contains(needs.variables.outputs.tag, '-beta') || contains(needs.variables.outputs.tag, '-rc') }}
          files: |
            ./artifacts/${{ needs.build-mac-arm64-release.outputs.artifact-name }}
            ./artifacts/${{ needs.build-mac-x86-release.outputs.artifact-name }}
            ./artifacts/${{ needs.build-win-release.outputs.artifact-name }}
            ./artifacts/${{ needs.build-linux-release.outputs.artifact-name }}